interface:
  display_name: "PSD 到 Unity UI"
  short_description: "维护 PSD 到 Unity UI；已有界面默认只导图片，新建或批准重生成时完成 Prefab 与绑定"
  default_prompt: "使用 $plink-psd-to-unity-ui，按当前阶段读取对应 MD；源更新先对比源稿、固定 _UI 和 01-PSD修改说明.md，差异经我审核后更新 _UI。已有正式 Prefab 时默认只导出图片，并按 03-图标归纳与命名说明.md 核验资源与现有引用；首次制作或我明确批准重生成时，再按 02-Prefab减法与布局说明.md 完成 Prefab 减法、适配与现成工具绑定。仅维护已有功能，不修改框架、导入器或生成器源码。"
